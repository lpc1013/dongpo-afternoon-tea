<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>灶前 · 烧菜</title>
<!-- 双击即玩。file:// 下只走相对路径的 <img>，不用 fetch／module／外链。
     案上摆的是实物不是牌：点柴束就添柴，点盐罐就下盐 —— 火不是话，不该有牌。 -->
<style>
  html, body { margin: 0; height: 100%; background: #0b0a09; overflow: hidden; }
  #wrap { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px;
    transform: translate(-50%,-50%); }
  /* 背景那张灶房里本来就有一口锅，桌上自己画的又有一口 —— 两口一样清楚，
     就成了"画面里怎么两口锅"。解法是景深，不是搬家：背景虚一级、压暗一层，
     眼睛把它读成"灶房深处那口"，桌上这口才是在你手里这一口。
     inset 往外扩 10px，是为了虚化边缘那圈发白的位置不在画面里。 */
  #bg { position: absolute; inset: -10px; background-size: cover; background-position: center;
    filter: blur(3.5px) brightness(.66) saturate(.92); }
  #bg::after { content: ""; position: absolute; inset: 0; background: rgba(14,10,8,.3); }

  /* 顶栏：菜名 + 一炷香 + 食单进度。整条落在不透明的牌上 ——
     背景是暖灰砖墙与木格窗，浅色字压上去看不清，这是用户点名的"大问题"。 */
  .top { position: absolute; left: 26px; top: 12px; right: 26px; display: flex; gap: 16px;
    align-items: baseline; padding: 7px 14px;
    font: 15px/1.5 "Microsoft YaHei","PingFang SC",sans-serif; color: #f4ead6;
    background: rgba(18,12,9,.94); border: 1px solid rgba(216,178,106,.45); }
  .top b { font: 400 25px/1.2 "STKaiti","KaiTi",serif; letter-spacing: 3px; color: #f7ecd8; }
  .top i { font-style: normal; color: #f2c66a; }
  .top .sp { margin-left: auto; }
  .top .back { cursor: pointer; border: 1px solid rgba(216,178,106,.5); padding: 3px 10px; }
  .top .re { cursor: pointer; color: #f2c66a; border-bottom: 1px dotted #f2c66a; }

  /* 四章四灶：章签在标题下面一行，切章＝换案上的实物与背景 */
  .chaps { position: absolute; left: 26px; top: 66px; display: flex; gap: 7px; }
  .chaps .c { cursor: pointer; padding: 6px 13px; font: 14px/1.2 "Microsoft YaHei",sans-serif;
    color: #e6d8bd; background: rgba(18,12,9,.92); border: 1px solid rgba(216,178,106,.45); }
  .chaps .c.on { color: #f7ecd8; background: #3f5a6b; border-color: #7fa3b8; }
  .chaps .c i { font-style: normal; color: #cbb89a; font-size: 12px; margin-left: 6px; }

  /* ── 一桌三物：灶眼、案板、调料架摆在同一条桌台上 ──────
     旧版把锅丢在画面正中、读数贴左墙、食谱挂右上、实物压在底部一条窄架上 ——
     五处散在画面里，读起来像"厨房的五张截图"，不像一站就够得着的灶。
     现在下三分之一是**一张桌子**：锅在左、读数在中、调料与主料在右，手一伸都够得着。
     锅也改回自己画的那口（背景那口在灶台里，跟桌面上的手位对不上）。 */
  .table { position: absolute; left: 0; right: 0; bottom: 0; height: 330px;
    background: linear-gradient(to bottom, rgba(24,15,10,0) 0, rgba(24,15,10,.72) 22%, rgba(14,9,6,.93) 62%);
    border-top: 1px solid rgba(216,178,106,.3); }
  .stove { position: absolute; left: 22px; bottom: 18px; width: 320px; height: 296px; }
  .stove .pot { position: absolute; left: 40px; bottom: 66px; width: 240px; }
  .stove .pot img { width: 100%; display: block; filter: drop-shadow(0 12px 18px rgba(0,0,0,.65)); }
  /* 汽 / 炭 / 一拍一震 —— 与 行旅.css 的灶前同一套（这个原型页先什么动画都没有，
     "锅是活的"就只剩数字在跳）。无头截图带 reduced-motion，`animation:none` 之后
     元素回到自己的静态样式，所以静态样式必须是"看得见"的那一版。 */
  .steam { position: absolute; left: 92px; bottom: 268px; width: 140px; height: 130px;
    opacity: 0; transition: opacity .5s; pointer-events: none; }
  .steam i { position: absolute; bottom: 0; width: 36px; height: 96px; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 100%, rgba(246,240,228,.7), rgba(246,240,228,0) 66%);
    animation: zsteam 3.4s ease-out infinite; }
  .steam i:nth-child(1) { left: 16px; }
  .steam i:nth-child(2) { left: 50px; height: 116px; animation-delay: 1.1s; }
  .steam i:nth-child(3) { left: 86px; height: 84px; animation-delay: 2.2s; }
  @keyframes zsteam { 0% { transform: translateY(-42px) scale(1.16); opacity: 0; }
    22% { opacity: .92; } 100% { transform: translateY(8px) scale(.74); opacity: .8; } }
  .coal { position: absolute; left: 92px; bottom: 58px; width: 136px; height: 36px;
    background: radial-gradient(ellipse at 50% 50%, rgba(255,142,52,.9), rgba(255,86,18,0) 70%);
    filter: blur(2px); animation: zcoal 1.7s ease-in-out infinite; pointer-events: none; }
  @keyframes zcoal { 0%, 100% { transform: scale(1.05); filter: blur(3px) brightness(1.3); }
    50% { transform: scale(1); filter: blur(2px) brightness(1); } }
  .stove.beat .pot { animation: zbeat .52s ease-out; }
  @keyframes zbeat { 0% { transform: translateY(0); } 26% { transform: translateY(4px) scale(1.018); }
    62% { transform: translateY(-2px) scale(.996); } 100% { transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) {
    .steam i, .coal, .stove.beat .pot, .meters .fill { animation: none; transition: none; } }
  .gauge { position: absolute; bottom: 0; width: 100px; text-align: center; }
  .gauge img { width: 70px; height: 70px; object-fit: contain; display: block; margin: 0 auto; }
  .gauge span { display: block; font: 13px/1.4 "Microsoft YaHei",sans-serif; color: #f4ead6;
    background: rgba(18,12,9,.88); border: 1px solid rgba(216,178,106,.4); }
  .g1 { left: 4px; } .g2 { left: 110px; } .g3 { left: 216px; }

  /* 读数条：火 / 糊 / 咸甜酸油 —— 已解锁才给数，没解锁只给「尝」的话 */
  /* 读帖：圈中的动词才解锁案上那件东西 */
  .tiep { position: absolute; inset: 0; background: rgba(8,6,5,.78); display: none;
    align-items: center; justify-content: center; }
  .tiep.on { display: flex; }
  .tiep .card { width: 620px; padding: 20px 26px 18px; background: #efe4cd;
    border: 1px solid #b9975b; color: #2e201a; }
  .tiep h3 { margin: 0 0 2px; font: 400 21px/1.4 "STKaiti","KaiTi",serif; letter-spacing: 2px; }
  .tiep .src { font: 11.5px/1.6 "Microsoft YaHei",sans-serif; color: #7a6248; margin-bottom: 10px; }
  .tiep .txt { font: 400 21px/2 "STKaiti","KaiTi",serif; letter-spacing: 1px; }
  .tiep .verb { cursor: pointer; border-bottom: 2px dotted #8c2820; padding: 0 2px; }
  .tiep .verb:hover { background: #f7ecd8; }
  .tiep .verb.got { background: #8c2820; color: #f7ecd8; border-bottom-color: transparent; }
  .tiep .list { margin-top: 12px; border-top: 1px dashed #b9975b; padding-top: 8px;
    font: 12.5px/1.9 "Microsoft YaHei",sans-serif; color: #5a4636; }
  .tiep .list b { color: #8c2820; font-weight: 400; }
  .tiep .go { display: inline-block; margin-top: 12px; padding: 7px 18px; cursor: pointer;
    border: 1px solid #8c2820; color: #8c2820; font: 13px/1 "Microsoft YaHei",sans-serif; }
  .tiep .go.skip { border-color: #a89a88; color: #7a6248; margin-left: 8px; }

  /* 读数落在**不透明的木牌**上 —— 背景是暖灰砖墙，浅色字加阴影压上去就是看不清。
     这是旧线那条铁律的延伸：字下面必须有不透明的纸。九行也都摆回桌上，不再贴左墙。 */
  .plate { background: rgba(18,12,9,.94); border: 1px solid rgba(216,178,106,.5);
    box-shadow: 0 5px 16px rgba(0,0,0,.55); }
  .meters { position: absolute; left: 358px; bottom: 14px; width: 320px; padding: 10px 14px 12px;
    background: rgba(18,12,9,.94); border: 1px solid rgba(216,178,106,.5);
    box-shadow: 0 5px 16px rgba(0,0,0,.55);
    font: 15px/1.62 "Microsoft YaHei",sans-serif; color: #f4ead6; }
  .meters .m { display: flex; gap: 8px; }
  .meters .m i { font-style: normal; width: 30px; color: #d8b26a; }
  .meters .bar { flex: 1 1 auto; height: 9px; background: rgba(70,52,38,.95);
    border: 1px solid rgba(216,178,106,.45); position: relative; }
  .meters .fill { position: absolute; left: 0; top: 0; bottom: 0; background: #c8562a;
    transition: width .45s cubic-bezier(.22, .7, .3, 1); }
  .meters .fill.up, .meters .fill.down { animation: zflash .62s ease-out; }
  @keyframes zflash { 0% { box-shadow: 0 0 0 2px rgba(242,198,106,.95); }
    100% { box-shadow: 0 0 0 0 rgba(242,198,106,0); } }
  .meters .fill.good { background: #7fb87f; }
  .meters .fill.bad { background: #e08a4a; }
  .meters .v { width: 104px; text-align: right; font-size: 13.5px; color: #efe2c6; }

  /* 食谱匾：已解锁把区间摊开写；未解锁只写菜名和那句帖 */
  .book { position: absolute; right: 16px; top: 84px; width: 386px; padding: 14px 18px 16px;
    background: rgba(18,12,9,.94); border: 1px solid rgba(216,178,106,.5);
    box-shadow: 0 5px 16px rgba(0,0,0,.55);
    font: 14.5px/1.8 "Microsoft YaHei",sans-serif; color: #f4ead6; }
  .book h3 { margin: 0 0 6px; font: 400 24px/1.3 "STKaiti","KaiTi",serif; letter-spacing: 2px; color: #f7ecd8; }
  .book .lock { color: #e08a4a; }
  .book .hint { color: #cbb89a; font-size: 13px; margin-top: 8px; }
  .book .need { margin-top: 10px; }
  .book .need div { display: flex; justify-content: space-between; border-bottom: 1px dotted rgba(216,178,106,.22); }
  .book .need b { font-weight: 400; color: #f2c66a; }
  /* 食谱匾限高，免得它一路长下去压到调料架（上一版"主料/要慢"两行就骑在添柴图上） */
  .book { max-height: 302px; overflow: hidden; }
  /* 菜谱切换挪到左栏说明牌下面：那块墙本来就是空的，
     放在右边就会压到食谱匾的"主料／要慢"两行 */
  .picks { position: absolute; left: 26px; top: 300px; width: 330px; display: flex; flex-wrap: wrap; gap: 7px; }
  .picks .p { cursor: pointer; padding: 7px 12px; border: 1px solid rgba(216,178,106,.45);
    font: 14.5px/1.3 "Microsoft YaHei",sans-serif; color: #f4ead6; background: rgba(18,12,9,.92); }
  .picks .p.on { background: #8c2820; border-color: #b9503a; color: #f7ecd8; }
  .picks .p.known { color: #f7ecd8; }
  .picks .p.tried { color: #e08a4a; }

  /* 案上一排实物 —— 不是牌，是摆在那儿的东西。
     13 件排成**两行**摆在桌右手（一行 58px 太小、看不清是什么；放大到 74 就得折行） */
  .tray { position: absolute; left: 700px; right: 16px; bottom: 10px; height: 244px; }
  .items { position: absolute; inset: 0; display: flex; flex-wrap: wrap;
    align-content: flex-end; justify-content: flex-start; gap: 4px 2px; }
  .it { position: relative; width: 72px; text-align: center; cursor: pointer; }
  .it img { width: 56px; height: 56px; object-fit: contain; display: block; margin: 0 auto;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.6)); }
  .it:hover img { transform: translateY(-5px); filter: drop-shadow(0 8px 10px rgba(0,0,0,.65)) brightness(1.1); }
  /* 名字与余量都落在小纸片上 —— 压在桌面上看不清 */
  .it .nm { display: inline-block; margin-top: 2px; padding: 1px 6px;
    font: 13px/1.35 "Microsoft YaHei",sans-serif; color: #f4ead6;
    background: rgba(18,12,9,.92); border: 1px solid rgba(216,178,106,.4); }
  .it .left { font: 11px/1.3 "Microsoft YaHei",sans-serif; color: #d8b26a;
    background: rgba(18,12,9,.8); padding: 0 4px; }
  /* 效果写在脸上（数从模型的 fx 现拼）—— 悬停不可发现：截图、触屏、第一次玩的人都不靠它 */
  .it .fxl { font: 10px/1.3 "Microsoft YaHei",sans-serif; color: #e6d5b2; word-break: break-all;
    background: rgba(18,12,9,.72); padding: 0 3px; margin-top: 1px; }
  .it.out .fxl { color: #9c8a72; }
  /* 本色角标：五件调料现在都拿别的器物顶图，只靠字认会读错，先给一层颜色 */
  .it .chip { height: 5px; width: 40px; margin: 3px auto 0; background: #777;
    box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
  .it.trap .nm { color: #f2b09a; border-color: #8c2820; }
  .it.trap img { filter: drop-shadow(0 0 7px rgba(160,44,34,.85)); }
  .it.out { opacity: .38; cursor: default; }
  .it.out img { filter: grayscale(1); }
  .it .tip { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%);
    white-space: nowrap; font: 12px/1.2 "Microsoft YaHei",sans-serif; color: #2e201a;
    background: #efe2c6; padding: 4px 8px; opacity: 0; pointer-events: none; transition: opacity .15s;
    z-index: 5; box-shadow: 0 3px 8px rgba(0,0,0,.5); }
  .it:hover .tip { opacity: 1; }
  .it.serve img { width: 66px; height: 66px; }
  .it.serve .nm { color: #f2c66a; }

  /* 案板这一手不能长得跟调料一样。给它一块木案底（走背景，不走伪元素 ——
     伪元素要压在这张图的下面就得建层叠上下文，桌布一挡就露馅），
     再把刀数写在案沿：未改刀／已切 N 刀，一眼看得见。 */
  .it.board { width: 96px; padding: 4px 6px 2px; background: linear-gradient(#6b4a2e, #46301e);
    border: 1px solid rgba(216,178,106,.45); box-shadow: inset 0 1px 0 rgba(255,240,210,.14); }
  .it.board .nm { background: #2b1c12; border-color: rgba(216,178,106,.6); }

  /* 浮字压在锅口上；尝味与漂移的话落在一张不透明的纸上（贴在左上，不占桌面） */
  .float { position: absolute; left: 22px; width: 320px; bottom: 336px; height: 36px;
    text-align: center; font: 16px/36px "Microsoft YaHei",sans-serif; color: #f6ecd8;
    background: rgba(18,12,9,.92); border: 1px solid rgba(216,178,106,.45);
    opacity: 0; transition: opacity .25s, transform .25s; }
  .float.on { opacity: 1; transform: translateY(-8px); }
  .notes { position: absolute; left: 26px; top: 118px; width: 330px; max-height: 150px;
    overflow: hidden; padding: 10px 14px; font: 14px/1.8 "Microsoft YaHei",sans-serif;
    color: #f4ead6; background: rgba(18,12,9,.92); border: 1px solid rgba(216,178,106,.45); }
  .notes div { border-bottom: 1px dashed rgba(216,178,106,.25); padding: 3px 0; }
  .notes div.taste { color: #f2c66a; }
  .notes div.bad { color: #e2a08c; }

  /* 出锅结算 */
  .over { position: absolute; inset: 0; background: rgba(8,6,5,.72); display: none;
    align-items: center; justify-content: center; }
  .over.on { display: flex; }
  .over .card { width: 520px; padding: 22px 26px; background: #17110d;
    border: 1px solid rgba(216,178,106,.55); font: 13px/1.8 "Microsoft YaHei",sans-serif; color: #efe6d5; }
  .over h2 { margin: 0 0 8px; font: 400 26px/1.3 "STKaiti","KaiTi",serif; letter-spacing: 3px; }
  .over .ok h2, .over h2.ok { color: #96c896; }
  .over h2.no { color: #e2a08c; }
  .over .new { color: #f2c66a; border: 1px solid rgba(242,198,106,.5); padding: 6px 10px; margin: 8px 0; }
  .over .btn { display: inline-block; margin-top: 12px; padding: 7px 16px; cursor: pointer;
    border: 1px solid rgba(216,178,106,.55); color: #f2e6cf; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bg"></div>
  <div class="table"></div>
  <div class="top"><b id="dish">—</b><i id="phase"></i><span id="turns"></span><span class="sp" id="unlocked"></span><span class="back" id="snd">响动</span><span class="back" id="again">重起一锅</span></div>
  <div class="chaps" id="chaps"></div>
  <div class="stove" id="stove">
    <div class="pot"><div class="steam" id="steam"><i></i><i></i><i></i></div>
      <div class="coal" id="coal"></div><img src="素材/pot-4-cut.png" alt=""></div>
    <div class="gauge g1"><img id="gf" src="素材/图标/gauge-fire-1.png" alt=""><span>火候</span></div>
    <div class="gauge g2"><img id="gp" src="素材/图标/gauge-pot-1.png" alt=""><span>锅底</span></div>
    <div class="gauge g3"><img id="gt" src="素材/图标/gauge-time-1.png" alt=""><span>一炷香</span></div>
  </div>
  <div class="meters" id="meters"></div>
  <div class="notes" id="notes"></div>
  <div class="book" id="book"></div>
  <div class="picks" id="picks"></div>
  <div class="float" id="float"></div>
  <div class="tray"><div class="items" id="items"></div></div>
  <div class="over" id="over"></div>
  <div class="tiep" id="tiep"></div>
</div>
<script src="行旅数据.js"></script>
<script src="灶前.js"></script>
<script>
(function () {
  "use strict";
  var Z = window.ZAO;
  var KEY = "zaoshen_unlocked_v1", P = null, notes = [], ft = 0;

  /* 音效走 行旅数据.js 那张台账：file:// 不许 fetch，json 读不进来，只能把数据文件当脚本读进来。
     哪一手响哪一个音住在 灶前.js 的 SND 里 —— 原型、主游戏、验收器三处共用一份。
     同一个音要能连着响：一条 Audio 播到一半再 play 会从头来，听感是"卡了一下"，
     所以每个音备两只轮着按（灶前一手一拍，最多连着两声）。 */
  var SND = Z.SND;
  var AU = {}, AMB = null, ambOn = false;
  var MUTE = false;
  try { MUTE = localStorage.getItem(KEY + "_mute") === "1"; } catch (e) { }
  function sfx(id) {
    if (MUTE || !id) return;
    var p = AU[id];
    if (!p) p = AU[id] = [new Audio(SFX_DIR + id + ".mp3"), new Audio(SFX_DIR + id + ".mp3")];
    var a = p[p.i = ((p.i || 0) + 1) % 2];
    try { a.currentTime = 0; var q = a.play(); if (q && q["catch"]) q["catch"](function () { }); } catch (e) { }
  }
  /* 灶声是环境不是回执：音量压到 0.35，别盖过手法那一下。
     浏览器不许无手势自动播，所以它等第一下手（doAct）才起来。 */
  function ambience(on) {
    if (on) {
      if (!AMB) { AMB = new Audio(SFX_DIR + "amb-stove.mp3"); AMB.loop = true; AMB.volume = 0.35; }
      try { var q = AMB.play(); if (q && q["catch"]) q["catch"](function () { }); } catch (e) { }
    } else if (AMB) AMB.pause();
  }
  function firstTouch() { if (!ambOn) { ambOn = true; ambience(!MUTE); } }
  function sndLabel() { el("snd").innerHTML = "响动 · " + (MUTE ? "关" : "开"); }

  /* 一章一套案上实物、一背景、一叠菜谱 —— 四章不是换菜，是换厨房 */
  var CH = Z.CHAPS[0], ACTS = Z.actsOf(CH), BOOK = Z.dishesOf(CH);

  function pickChap(id) {
    CH = Z.chapOf(id); ACTS = Z.actsOf(CH); BOOK = Z.dishesOf(CH);
    pick(BOOK[0]);
  }

  function store() {
    try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { return []; }
  }
  function save(id) {
    var a = store(); if (a.indexOf(id) < 0) a.push(id);
    try { localStorage.setItem(KEY, JSON.stringify(a)); } catch (e) { }
  }
  function known(r) { return r.known || store().indexOf(r.id) >= 0; }

  function art(n) { return "素材/" + n; }
  function el(id) { return document.getElementById(id); }
  function scale() {
    var k = Math.min(innerWidth / 1280, innerHeight / 720);
    el("wrap").style.transform = "translate(-50%,-50%) scale(" + k + ")";
  }
  addEventListener("resize", scale);

  function pick(r) {
    P = Z.newPot(r); notes = []; el("over").className = "over";
    el("bg").style.backgroundImage = "url('" + CH.bg + "')";
    /* 开局先说人话：这一锅要什么、炭会不会自己烧、没学过该怎么办。
       进来对着一口锅一排东西不知道干什么，就是"玩法不明"。
       笔记要先写再 draw —— 反过来这一屏就看不到开局那句。 */
    var n = r.need;
    note("—— 新起一锅：" + r.nm + " ——");
    note(known(r) ? "这一锅要：火候 " + n.hf[0] + "–" + n.hf[1] + " · 咸 " + n.salt[0] + "–" + n.salt[1] +
      " · 甜 " + n.sugar[0] + "–" + n.sugar[1] + " · 酸 " + n.sour[0] + "–" + n.sour[1] +
      " · 油 " + n.oil[0] + "–" + n.oil[1] + " · 糊锅不过 " + n.sc[1] + "，" +
      (n.meat === 1 ? "须下主料" : "不许下主料") +
      (n.cut === 1 ? "，且非改刀不可" : n.cut === 0 ? "，且整颗下锅不许切" : "") +
      (n.slow ? "，且要满 " + n.slow + " 拍（" +
        (n.cut === 0 ? "整颗下锅，这一锅按 " : "没改刀按 ") + (n.slow + 2) + " 拍算）" : "") +
      "。炭会自己烧 —— 你不动它，它也动。"
      : "这一锅没学过：读数全是问号。先按「尝味」，它只给方向不给数；试对了才入食单。", "taste");
    draw();
    /* #notie ＝ 拍桌面的样子用（跟主游戏 #nodlg 同一个套路）：
       不自动弹读帖，让截图拍到弹窗之外的布局。 */
    if (Z.tieOf(r) && !/notie/.test(location.hash)) renderTie();
    else el("tiep").className = "tiep";
  }
  /* 读帖 = 在原文里圈动词。圈中的那件实物才上案 ——
     不是扣分，是"你还没学会这一手"。定州／儋州没有原文，所以根本没这一屏。 */
  function renderTie() {
    var t = Z.tieOf(P.r), h = "", rest = t.text, guard = 0;
    while (rest.length && guard++ < 30) {
      var hit = null, at = -1;
      for (var i = 0; i < t.marks.length; i++) {
        if (h.indexOf(">" + t.marks[i].sub + "<") >= 0) continue;
        var k = rest.indexOf(t.marks[i].sub);
        if (k >= 0 && (at < 0 || k < at)) { at = k; hit = t.marks[i]; }
      }
      if (!hit) { h += rest; break; }
      h += rest.slice(0, at);
      h += '<span class="verb' + (P.read[hit.act] ? " got" : "") + '" data-mark="' + hit.act + '">' + hit.sub + "</span>";
      rest = rest.slice(at + hit.sub.length);
    }
    var got = t.marks.filter(function (m) { return P.read[m.act]; }).length;
    el("tiep").innerHTML = '<div class="card"><h3>读帖 · ' + P.r.nm + "</h3>" +
      '<div class="src">' + t.src + " —— 圈出他写的动作，才知道这一锅该怎么伺候</div>" +
      '<div class="txt">' + h + '</div><div class="list">' +
      t.marks.map(function (m) {
        return "<div>" + (P.read[m.act] ? "✓ " : "· ") + "<b>「" + m.sub + "」</b> → " + m.note + "</div>";
      }).join("") + "</div>" +
      '<div class="go" data-tie="fire">' + (got ? "开火" : "先开火") + "</div>" +
      '<div class="go skip" data-tie="close">收起帖子</div></div>';
    el("tiep").className = "tiep on";
  }
  el("tiep").addEventListener("click", function (e) {
    var v = e.target.closest("[data-mark]");
    if (v) { sfx("brush"); Z.mark(P, v.getAttribute("data-mark")); renderTie(); draw(); return; }
    var g = e.target.closest("[data-tie]");
    if (!g) return;
    /* 「开火」与「收起帖子」在画面上是同一个动作（关掉这一屏），
       在灶上是两回事：一个起了火，一个只是把帖合上。 */
    if (g.getAttribute("data-tie") === "fire") { firstTouch(); sfx("fire"); } else sfx("paper");
    el("tiep").className = "tiep";
  });
  function note(t, cls) { notes.unshift({ t: t, c: cls || "" }); if (notes.length > 5) notes.pop(); }

  function fireLv() {
    var n = P.r.need;
    return P.hf < n.hf[0] ? 1 : P.hf > n.hf[1] ? 3 : 2;
  }
  function potLv() { return P.sc === 0 ? 1 : P.sc <= P.r.need.sc[1] ? 2 : 3; }
  function timeLv() { var k = P.turn / P.turns; return k < 0.4 ? 1 : k < 0.75 ? 2 : 3; }

  function meter(nm, v, rng, max) {
    var pct = clamp(v / max * 100, 0, 100);
    var cls = !rng ? "" : (v < rng[0] ? "" : v > rng[1] ? "bad" : "good");
    var txt = known(P.r) ? v + " / " + (rng ? rng[0] + "–" + rng[1] : "—") : "?";
    return '<div class="m"><i>' + nm + '</i><div class="bar"><div class="fill ' + cls +
      '" style="width:' + pct + '%"></div></div><div class="v">' + txt + "</div></div>";
  }
  function tieSub(k) {
    var t = Z.tieOf(P.r);
    if (!t) return "";
    for (var i = 0; i < t.marks.length; i++) if (t.marks[i].act === k) return t.marks[i].sub;
    return "";
  }
  function row(nm, frac, txt, cls) {
    return '<div class="m"><i>' + nm + '</i><div class="bar"><div class="fill ' + (cls || "") +
      '" style="width:' + clamp(frac * 100, 0, 100) + '%"></div></div><div class="v">' + txt + "</div></div>";
  }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  /* 这一手会改什么，写在东西脸上 —— 原来只在悬停里，而悬停不可发现。
     数从模型的 `fx` 现拼，不另写一份文案（改了模型忘了改说明，比没有说明更坏）。 */
  var FXLB = { stoke: "炭", lid: "盖", hf: "火", salt: "咸", sugar: "甜", sour: "酸",
    oil: "油", sc: "糊", tang: "汤", body: "身" };
  function fxText(a) {
    if (a.serve) return "起锅";
    if (a.quiet) return "只给方向";
    if (a.board) return "走一拍";
    var s = [], f;
    if (a.fx.meat) s.push("主料");
    if (a.fx.chop) s.push("改刀");
    for (f in a.fx) if (FXLB[f]) s.push((a.fx[f] > 0 ? "+" : "") + a.fx[f] + FXLB[f]);
    return s.join(" ");
  }

  /* 读数条要"滑"过去不是"跳"过去：`draw()` 整段换 innerHTML，新节点没有旧值，
     transition 永远不触发 —— 与主游戏 `meterSlide()` 同一个病同一个解。 */
  var MPREV = {}, BEAT = false;
  function mkey(m) { var e = m.firstElementChild; return e ? e.textContent : ""; }
  function snapMeters() {
    var ms = document.querySelectorAll("#meters .m"), o = {}, i, f;
    for (i = 0; i < ms.length; i++) {
      f = ms[i].querySelector(".fill");
      if (f) o[mkey(ms[i])] = parseFloat(f.style.width) || 0;
    }
    return o;
  }
  function slideMeters(prev) {
    var ms = document.querySelectorAll("#meters .m"), i, f, k, to;
    for (i = 0; i < ms.length; i++) {
      f = ms[i].querySelector(".fill"); k = mkey(ms[i]);
      if (!f || !(k in prev)) continue;
      to = parseFloat(f.style.width) || 0;
      if (Math.abs(to - prev[k]) < 0.4) continue;
      f.style.transition = "none"; f.style.width = prev[k] + "%";
      void f.offsetWidth;                       // 起点钉死，下一步才谈得上"变化"
      f.style.transition = ""; f.style.width = to + "%";
      f.className = "fill" + (to > prev[k] ? " up" : " down");
    }
    var st = el("stove");
    st.className = "stove"; void st.offsetWidth;
    if (BEAT) { st.className = "stove beat"; BEAT = false; }   // 连续两拍也要重头震
    el("coal").style.opacity = (0.25 + P.stoke / 3 * 0.75).toFixed(2);
  }
  function draw() {
    var r = P.r, n = r.need, kn = known(r), i, h = "";
    el("dish").innerHTML = "灶前 · " + r.nm;
    el("phase").innerHTML = (kn ? "" : '<span class="lock">未解锁 · 只能靠尝</span>') +
      (Z.tieOf(r) ? '　<span class="re" data-tieopen="1">重读帖</span>' : "");
    el("turns").innerHTML = "　一炷香 " + (P.turns - P.turn) + " 拍";
    el("unlocked").innerHTML = "四章食单已得 " + Z.BOOK.filter(known).length + " / " + Z.BOOK.length;
    el("chaps").innerHTML = Z.CHAPS.map(function (c) {
      var n = Z.dishesOf(c), got = n.filter(known).length;
      return '<div class="c' + (c.id === CH.id ? " on" : "") + '" data-c="' + c.id + '">' + c.nm +
        "<i>" + c.age + " · " + got + "/" + n.length + "</i></div>";
    }).join("");
    el("steam").style.opacity = P.hf > 40 ? (P.hf / 130).toFixed(2) : 0;
    el("gf").src = art("图标/gauge-fire-" + fireLv() + ".png");
    el("gp").src = art("图标/gauge-pot-" + potLv() + ".png");
    el("gt").src = art("图标/gauge-time-" + timeLv() + ".png");

    /* 炭势与盖子是**锅自己的状态**，跟食谱解锁无关，永远要看得见 ——
       看不到炭就看不懂"这一拍为什么只涨一点" */
    MPREV = snapMeters();
    el("meters").innerHTML =
      meter("火", P.hf, n.hf, 130) + meter("糊", P.sc, n.sc, 6) +
      meter("咸", P.salt, n.salt, 12) + meter("甜", P.sugar, n.sugar, 9) +
      meter("酸", P.sour, n.sour, 9) + meter("油", P.oil, n.oil, 12) +
      row("炭", P.stoke / 3, P.stoke > 0 ? P.stoke.toFixed(2) : "炭尽") +
      row("盖", P.lid > 0 ? 1 : 0, P.lid > 0 ? "压着" : "掀开") +
      row("刀", P.chops ? 1 : 0, P.chops ? "已切 " + P.chops + " 刀" :
        (n.cut === 1 ? "未改刀 · 非切不可" : n.cut === 0 ? "未改刀 · 该整颗下" : "未改刀"),
        P.chops ? (n.cut === 0 ? "bad" : "good") : (n.cut === 1 ? "bad" : "")) +
      '<div class="m"><i>汤</i><div class="bar"></div><div class="v">' + P.tang + " · 主料 " + (P.meat ? "有" : "无") + "</div></div>" +
      row("身体", P.body / 100, Math.round(P.body) + (P.body < Z.URGE_MIN ? " 撑不住催" : ""),
        P.body < Z.URGE_MIN ? "bad" : "good");
    slideMeters(MPREV);

    h = "<h3>" + r.nm + "</h3>";
    h += kn ? '<div>按帖上写的来：</div>' : '<div class="lock">这一锅没学过，帖上只留了一句话：</div>';
    h += '<div class="hint">' + r.hint + "</div>";
    if (kn) {
      h += '<div class="need">' +
        [["火候", n.hf], ["咸", n.salt], ["甜", n.sugar], ["酸", n.sour], ["油", n.oil], ["糊锅", n.sc]]
          .map(function (x) { return "<div><span>" + x[0] + "</span><b>" + x[1][0] + "–" + x[1][1] + "</b></div>"; }).join("") +
        '<div><span>主料</span><b>' + (n.meat === 1 ? "须下（这一案的主料）" : "不许下") + "</b></div>" +
        '<div><span>改刀</span><b>' + (n.cut === 1 ? "须切 —— 切了火候下限 -8、入味 ×1.25" :
          n.cut === 0 ? "不许切，整颗下锅" : "可切可不切（各是一条路）") + "</b></div>" +
        (n.slow ? '<div><span>要慢</span><b>' + (P.chops ? "≥ " + n.slow + " 拍（切过了）" :
          "≥ " + n.slow + " 拍 · 没改刀要 " + (n.slow + 2)) + "</b></div>" : "") + "</div>";
    } else h += '<div class="hint">' + r.note + "</div>";
    el("book").innerHTML = h;

    el("picks").innerHTML = BOOK.map(function (b) {
      var c = b === r ? " on" : "";
      return '<div class="p' + (known(b) ? " known" : " tried") + c + '" data-id="' + b.id + '">' +
        b.nm + (known(b) ? "" : "？") + "</div>";
    }).join("");

    /* 配额走模型的 cap()：被帖挡着的那件，余数显示「未读帖」而不是「余 0」——
       玩家要读到的信息是"我还没学会"，不是"这东西用完了" */
    el("items").innerHTML = ACTS.map(function (a) {
      var cap = Z.cap(P, a.k), left = cap - P.used[a.k];
      var tied = cap === 0 && a.uses > 0 && !a.serve;
      var weak = a.trap && P.body < Z.URGE_MIN;
      return '<div class="it' + ((left <= 0 || weak) && !a.serve ? " out" : "") + (tied ? " tied" : "") +
        (a.serve ? " serve" : "") + (a.trap ? " trap" : "") + (a.board ? " board" : "") + '" data-k="' + a.k + '"><span class="tip">' +
        (tied ? "这一手你还没从帖里读出来 —— 先去把「" + tieSub(a.k) + "」圈了"
          : weak ? "身子撑不住催火（身体要 ≥ " + Z.URGE_MIN + "）"
          : a.board ? "切一刀也要走一拍：入味 ×1.25、火候下限 -8；可有的菜整颗下锅，切了就不是它"
          : (a.say || "尝一口：只给方向，不给数")) +
        '</span><img src="' + art(a.ic) + '" alt=""><div class="nm">' + a.nm + "</div><div class=\"left\">" +
        (a.serve ? "" : tied ? "未读帖" : a.board ? (P.chops ? "已切 " + P.chops + " 刀" : "未改刀") : "余 " + left) + "</div>" +
        '<div class="fxl">' + fxText(a) + "</div>" +
        '<div class="chip" style="background:' + (a.col || "#777") + '"></div></div>';
    }).join("");

    el("notes").innerHTML = notes.map(function (x) { return '<div class="' + x.c + '">' + x.t + "</div>"; }).join("");
  }

  function flash(t) {
    var f = el("float"); f.innerHTML = t; f.className = "float on";
    clearTimeout(ft); ft = setTimeout(function () { f.className = "float"; }, 1300);
  }

  function doAct(k) {
    var a = null, i;
    for (i = 0; i < ACTS.length; i++) if (ACTS[i].k === k) a = ACTS[i];
    var res = Z.act(P, k);
    if (!res) return;
    /* 响动是这一手的回执：空手与被驳回也要响，不然点了没声，玩家以为卡住。
       灶声要等第一下手才起 —— 浏览器不许无手势自动播。 */
    firstTouch();
    sfx(res.empty || res.weak ? "reject" : (SND[k] || "card"));
    if (res.empty) {
      note(res.tied ? "「" + a.nm + "」这一手你还没从帖里读出来 —— 先重读帖，把「" + tieSub(k) + "」圈了"
        : a.nm + "用完了", "bad");
      draw(); return;
    }
    if (res.weak) { note("身子撑不住催火：身体 " + res.body + "，要 ≥ " + res.need + " —— 去煨一锅芋", "bad"); draw(); return; }
    BEAT = true;                    // 从这里往下都是"真的走了一拍"：锅要震、读数要滑
    if (res.taste) { note("尝：" + res.taste, "taste"); flash("尝了一口"); draw(); return; }
    if (res.say) note(a.nm + "：" + res.say);
    /* 把"锅这一拍自己干了什么"写出来 —— 不让玩家看见漂移，漂移就等于没发生 */
    if (!res.over) {
      note("这一拍锅自己走：火候 +" + P.lastGain.toFixed(1) + " 炭余 " + P.stoke.toFixed(2) +
        (P.lastScorch ? " · 越过火候上限，锅底糊了一层" : ""), P.lastScorch ? "bad" : "");
      /* 糊锅声只在**起头那一下**响：一路烧下去还一直刺啦，就成了噪音而不是警告 */
      if (P.lastScorch && P.sc === 1) sfx("scorch");
    }
    flash((res.say || "") + (res.over ? "" : "　→ 火候 +" + P.lastGain.toFixed(1)));
    draw();
    if (res.over) finish(res.over);
  }

  /* 结算不写"失败"两个字 —— 每一锅都对应《猪肉颂》里的一句，并且都有一个去处。
     做烂了不是判负，是又 got 到一句诗。 */
  function finish(o) {
    var r = o.r, e = o.end || Z.endingOf(P), h = "";
    sfx(o.ok ? "seal" : "reject");
    if (o.ok && !known(r)) { save(r.id); note("这一锅试对了 —— 「" + r.nm + "」记入食单", "taste"); }
    h = '<h2 class="' + (o.ok ? "ok" : "no") + '">「' + e.q + '」</h2>' +
      "<div>" + r.nm + " · " + e.to + "</div>" +
      (o.fresh ? '<div class="new">新食谱解锁：' + r.nm + "　下回这一锅就有靶子可看了</div>" : "") +
      '<div style="margin-top:10px;color:#cbb89a">火候 ' + Math.round(P.hf) + " · 咸 " + P.salt +
      " · 甜 " + P.sugar + " · 酸 " + P.sour + " · 油 " + P.oil + " · 糊 " + P.sc +
      " · 用了 " + P.turn + "/" + P.turns + " 拍 · 身体 " + Math.round(P.body) + "</div>";
    if (!o.ok && o.bad && o.bad.length)
      h += '<div style="margin-top:6px;color:#e2a08c">差在：' + o.bad.join("　") + "</div>";
    h += '<div style="margin-top:10px;color:#a89a88;font-size:12.5px">' + r.hint + "</div>";
    el("over").innerHTML = '<div class="card">' + h +
      '<div class="btn" id="re">再来一锅</div><div class="btn" id="nx">换一道菜</div></div>';
    el("over").className = "over on";
    el("re").onclick = function () { pick(r); };
    el("nx").onclick = function () { el("over").className = "over"; };
    draw();
  }

  el("items").addEventListener("click", function (e) {
    var t = e.target.closest(".it"); if (!t) return;
    doAct(t.getAttribute("data-k"));
  });
  el("picks").addEventListener("click", function (e) {
    var t = e.target.closest(".p"); if (!t) return;
    for (var i = 0; i < BOOK.length; i++) if (BOOK[i].id === t.getAttribute("data-id")) pick(BOOK[i]);
  });
  el("chaps").addEventListener("click", function (e) {
    var t = e.target.closest(".c"); if (!t) return;
    pickChap(t.getAttribute("data-c"));
  });
  el("again").onclick = function () { pick(P.r); };
  /* 响动一个开关管全部（含灶声）：灶前是"手一手一手"的屏，
     一半响一半不响的开关只会让人以为坏了。 */
  el("snd").onclick = function () {
    MUTE = !MUTE;
    try { localStorage.setItem(KEY + "_mute", MUTE ? "1" : "0"); } catch (e) { }
    ambience(!MUTE && ambOn); sndLabel();
  };
  document.addEventListener("click", function (e) {
    if (e.target.closest("[data-tieopen]")) renderTie();
  });

  /* #sndprobe ＝ 自测用的一屏：把灶前用到的每个音各 load 一遍，能播的数出来挂在
     #wrap 的 data-snd 上（跟主游戏 data-screen 同一套路）。
     file:// 下 new Audio 不会同步报错，只有 load 事件才知道这个文件在不在 ——
     "接线写错一个 id"这种错，只有这样才能被验收器看见。 */
  function sndProbe() {
    var ids = [], k;
    for (k in SND) if (ids.indexOf(SND[k]) < 0) ids.push(SND[k]);
    ids.push("amb-stove");
    var good = 0, done = 0;
    function tally() {
      if (++done < ids.length) return;
      el("wrap").setAttribute("data-snd", good + "/" + ids.length);
    }
    var EXT = {};
    (typeof SFX !== "undefined" ? SFX : []).forEach(function (x) { EXT[x.f] = x.ext || "mp3"; });
    ids.forEach(function (id) {
      var a = new Audio(SFX_DIR + id + "." + (EXT[id] || "mp3"));
      a.preload = "auto";
      a.addEventListener("canplaythrough", function () { good++; tally(); });
      a.addEventListener("error", tally);
      a.load();
    });
  }
  if (/sndprobe/.test(location.hash)) sndProbe();

  /* #notie 只压住读帖弹窗；#c=dingzhou&d=zhengli 是给截图脚本挑章挑菜用的 ——
     拍不到另外三间灶房，验收就只看得见黄州那一张桌子。
     #a=chestnut,stoke 再补一手：按顺序把这几拍真打一遍，才拍得到"切过之后"的案子。 */
  function boot() {
    var mc = /(?:#|&)c=([a-z]+)/.exec(location.hash),
      md = /(?:#|&)d=([a-z]+)/.exec(location.hash),
      ma = /(?:#|&)a=([a-z_,]+)/.exec(location.hash),
      c = mc && Z.chapOf(mc[1]), r = null;
    if (c) { CH = c; ACTS = Z.actsOf(c); BOOK = Z.dishesOf(c); }
    if (md) for (var i = 0; i < BOOK.length; i++) if (BOOK[i].id === md[1]) r = BOOK[i];
    scale(); sndLabel(); pick(r || BOOK[0]);
    if (ma) ma[1].split(",").forEach(function (k) { doAct(k); });
  }
  boot();
})();
</script>
</body>
</html>
